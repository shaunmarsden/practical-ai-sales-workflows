<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title description">
  <title id="title">Where to start with AI in sales</title>
  <desc id="description">Four starting routes based on current experience: starting from scratch, using AI occasionally, using it regularly or adapting workflows for a team.</desc>
  <style>
    :root{--ink:#1f2937;--muted:#57606a;--line:#d0d7de;--card:#f6f8fa;--blue:#0969da;--blue-bg:#ddf4ff;--purple:#8250df;--purple-bg:#fbefff}
    @media (prefers-color-scheme:dark){:root{--ink:#f0f6fc;--muted:#a9b1bb;--line:#30363d;--card:#161b22;--blue:#58a6ff;--blue-bg:#0d419d;--purple:#d2a8ff;--purple-bg:#3b1d68}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}text:not([fill]){fill:var(--ink)}.card{fill:var(--card);stroke:var(--line);stroke-width:2}.num{font-size:15px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:15px;fill:var(--muted)}.top{font-size:23px;font-weight:700}.sub{font-size:16px;fill:var(--muted)}.footer{font-size:16px;font-weight:600}
  </style>
  <text class="top" x="20" y="36">Start with your current use, not the most advanced option.</text><text class="sub" x="20" y="62">Choose one route, complete one useful task and move on only when it helps.</text>
  <rect class="card" x="20" y="100" width="225" height="200" rx="14"/><rect x="20" y="100" width="225" height="38" rx="14" fill="var(--blue-bg)"/><text class="num" x="42" y="126" fill="var(--blue)">01</text><text class="head" x="42" y="174">Starting from</text><text class="head" x="42" y="199">scratch</text><text class="body" x="42" y="234">Set up safe context</text><text class="body" x="42" y="256">and try one task.</text>
  <rect class="card" x="265" y="100" width="225" height="200" rx="14"/><rect x="265" y="100" width="225" height="38" rx="14" fill="var(--blue-bg)"/><text class="num" x="287" y="126" fill="var(--blue)">02</text><text class="head" x="287" y="174">Used it</text><text class="head" x="287" y="199">a bit</text><text class="body" x="287" y="234">Make one useful</text><text class="body" x="287" y="256">prompt repeatable.</text>
  <rect class="card" x="510" y="100" width="225" height="200" rx="14"/><rect x="510" y="100" width="225" height="38" rx="14" fill="var(--blue-bg)"/><text class="num" x="532" y="126" fill="var(--blue)">03</text><text class="head" x="532" y="174">Used it</text><text class="head" x="532" y="199">a lot</text><text class="body" x="532" y="234">Add shared context</text><text class="body" x="532" y="256">and check quality.</text>
  <rect class="card" x="755" y="100" width="225" height="200" rx="14"/><rect x="755" y="100" width="225" height="38" rx="14" fill="var(--purple-bg)"/><text class="num" x="777" y="126" fill="var(--purple)">04</text><text class="head" x="777" y="174">Ready to</text><text class="head" x="777" y="199">adapt it</text><text class="body" x="777" y="234">Test, improve and</text><text class="body" x="777" y="256">share a method.</text>
  <rect x="20" y="330" width="960" height="42" rx="10" fill="var(--blue-bg)"/><text class="footer" x="500" y="357" text-anchor="middle" fill="var(--blue)">More technical does not automatically mean more useful.</text>
</svg>
