<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title description">
  <title id="title">How I approach AI sales work</title>
  <desc id="description">A four-step evidence-led flow: collect approved context, label the evidence, let AI prepare a draft, then let a person decide and approve the action.</desc>
  <style>
    :root{--ink:#1f2937;--muted:#57606a;--line:#d0d7de;--card:#f6f8fa;--blue:#0969da;--blue-bg:#ddf4ff;--purple:#8250df;--purple-bg:#fbefff;--green:#1a7f37;--green-bg:#dafbe1}
    @media (prefers-color-scheme:dark){:root{--ink:#f0f6fc;--muted:#a9b1bb;--line:#30363d;--card:#161b22;--blue:#58a6ff;--blue-bg:#0d419d;--purple:#d2a8ff;--purple-bg:#3b1d68;--green:#7ee787;--green-bg:#15361d}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}text:not([fill]){fill:var(--ink)}.card{fill:var(--card);stroke:var(--line);stroke-width:2}.step{font-size:13px;font-weight:700;letter-spacing:.06em}.head{font-size:21px;font-weight:700}.body{font-size:15px;fill:var(--muted)}.arrow{stroke:var(--line);stroke-width:3;fill:none}.bottom{font-size:16px;font-weight:600}
  </style>
  <text x="20" y="34" class="head">The method is evidence-led, not prompt-led.</text><text x="20" y="60" class="body">Start with the real sales job, then make the reasoning visible before acting.</text>
  <rect class="card" x="20" y="102" width="214" height="164" rx="14"/><text class="step" x="44" y="130" fill="var(--blue)">STEP 1</text><text class="head" x="44" y="164">Collect context</text><text class="body" x="44" y="194">Use current, approved</text><text class="body" x="44" y="216">notes, CRM facts and</text><text class="body" x="44" y="238">reference material.</text>
  <rect class="card" x="272" y="102" width="214" height="164" rx="14"/><text class="step" x="296" y="130" fill="var(--purple)">STEP 2</text><text class="head" x="296" y="164">Label evidence</text><text class="body" x="296" y="194">Separate what is</text><text class="body" x="296" y="216">confirmed, estimated,</text><text class="body" x="296" y="238">inferred or unknown.</text>
  <rect class="card" x="524" y="102" width="214" height="164" rx="14"/><text class="step" x="548" y="130" fill="var(--blue)">STEP 3</text><text class="head" x="548" y="164">AI prepares</text><text class="body" x="548" y="194">Organise the evidence,</text><text class="body" x="548" y="216">draft useful outputs</text><text class="body" x="548" y="238">and show gaps.</text>
  <rect class="card" x="776" y="102" width="204" height="164" rx="14"/><text class="step" x="800" y="130" fill="var(--green)">STEP 4</text><text class="head" x="800" y="164">Person decides</text><text class="body" x="800" y="194">Check the output,</text><text class="body" x="800" y="216">make the judgement</text><text class="body" x="800" y="238">and approve action.</text>
  <path class="arrow" d="M234 184H272M486 184H524M738 184H776"/>
  <rect x="20" y="296" width="960" height="42" rx="10" fill="var(--blue-bg)"/><text class="bottom" x="500" y="323" text-anchor="middle" fill="var(--blue)">The output can be useful without being treated as a fact, a decision or an action.</text>
</svg>
