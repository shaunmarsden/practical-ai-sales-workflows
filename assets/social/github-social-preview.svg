<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Practical AI Sales Workflows</title>
  <desc id="description">A practical system for B2B sales work: choose the sales problem, label the evidence, let AI prepare the work and keep a person responsible for the decision.</desc>
  <style>
    :root{--ink:#1f2937;--muted:#57606a;--line:#d0d7de;--card:#f6f8fa;--blue:#0969da;--blue-bg:#ddf4ff;--purple:#8250df;--purple-bg:#fbefff}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}text:not([fill]){fill:var(--ink)}.head{font-size:58px;font-weight:750}.sub{font-size:28px;fill:var(--muted)}.card{fill:var(--card);stroke:var(--line);stroke-width:3}.num{font-size:18px;font-weight:700;fill:#fff}.label{font-size:25px;font-weight:700}.body{font-size:18px;fill:var(--muted)}.footer{font-size:23px;font-weight:700}
  </style>
  <rect width="1280" height="640" fill="#ffffff"/>
  <rect x="70" y="76" width="10" height="150" rx="5" fill="var(--blue)"/>
  <text class="head" x="115" y="137">Practical AI Sales Workflows</text><text class="sub" x="115" y="190">Useful help for real B2B sales work</text>
  <rect class="card" x="70" y="285" width="260" height="192" rx="18"/><circle cx="106" cy="321" r="18" fill="var(--blue)"/><text class="num" x="106" y="327" text-anchor="middle">1</text><text class="label" x="106" y="375">Choose a sales problem</text><text class="body" x="106" y="414">Start with work you</text><text class="body" x="106" y="439">already need to do.</text>
  <rect class="card" x="365" y="285" width="260" height="192" rx="18"/><circle cx="401" cy="321" r="18" fill="var(--blue)"/><text class="num" x="401" y="327" text-anchor="middle">2</text><text class="label" x="401" y="375">Label the evidence</text><text class="body" x="401" y="414">Keep facts, estimates</text><text class="body" x="401" y="439">and unknowns visible.</text>
  <rect class="card" x="660" y="285" width="260" height="192" rx="18"/><circle cx="696" cy="321" r="18" fill="var(--blue)"/><text class="num" x="696" y="327" text-anchor="middle">3</text><text class="label" x="696" y="375">AI prepares</text><text class="body" x="696" y="414">Organise, draft and</text><text class="body" x="696" y="439">show gaps.</text>
  <rect class="card" x="955" y="285" width="255" height="192" rx="18"/><circle cx="991" cy="321" r="18" fill="var(--purple)"/><text class="num" x="991" y="327" text-anchor="middle">4</text><text class="label" x="991" y="375">Person decides</text><text class="body" x="991" y="414">Check the output and</text><text class="body" x="991" y="439">approve the action.</text>
  <rect x="70" y="530" width="1140" height="52" rx="12" fill="var(--purple-bg)"/><text class="footer" x="640" y="564" text-anchor="middle" fill="var(--purple)">Human-led AI workflows. Fictional examples. Honest evaluation.</text>
</svg>
